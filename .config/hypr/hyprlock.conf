# hyprlock.conf

background {
    monitor =
    path = screenshot # or path to your wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 200, 200, 0.8)
    font_size = 22
    font_family = Inter, Sans-Serif
    position = 0, 320
    halign = center
    valign = center
}

# Time Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 240, 0.95)
    font_size = 72
    font_family = Inter Bold, Sans-Serif
    position = 0, 230
    halign = center
    valign = center
}

# Profile Picture / Logo
image {
    monitor =
    path = ~/.config/hypr/avatar.png # path to your profile picture or logo
    size = 90
    border_size = 0
    rounding = -1 # makes it circular
    position = 0, -100
    halign = center
    valign = center
}

# Username Label
label {
    monitor =
    text = $USER
    color = rgba(200, 200, 200, 0.8)
    font_size = 18
    font_family = Inter, Sans-Serif
    position = 0, -170
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 180, 36
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = rgba(250, 250, 250, 0.8)
    inner_color = rgba(60, 65, 75, 0.6)
    font_family = Inter, Sans-Serif
    placeholder_text = Enter Password
    hide_input = false
    rounding = 18

    position = 0, -220
    halign = center
    valign = center
}

# PAM Authentication
auth {
	pam {
		enabled = true
		module = hyprlock
	}
}

